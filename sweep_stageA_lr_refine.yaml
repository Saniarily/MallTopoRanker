# Stage A: narrow LR confirmation (optimizer fixed to AdamW)
# Goal: verify stability around the best zone found in stage-1.

seeds: [42, 43, 44]

shared_overrides:
  train.split_seed: 42
  train.pair_train_seed: 43
  train.pair_val_seed: 44

  model.d_model: 40
  model.gnn_layers: 3
  regularization.min_dropout: 0.25
  regularization.min_weight_decay: 0.0005

  train.optimizer: adamw
  train.epochs: 24
  train.pairs_per_bucket: 2000

  val_eval.max_val_pair_batches: 80
  val_eval.max_queries_per_bucket: 25
  val_eval.max_candidates_per_query: 350
  val_eval.dynamic_seed: false
  val_eval.seed: 61001

  early_stopping.patience: 6
  early_stopping.min_delta: 0.0002
  scheduler.patience: 2
  scheduler.factor: 0.5

factors:
  - name: lr_refine
    key: train.lr
    values: [0.0008, 0.0010, 0.0012, 0.0015]
